<svg width="960" height="960" viewBox="0 0 960 960" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="clip0_4_2">
    <rect width="960" height="960" rx="216" fill="white"/>
  </clipPath>

  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#344626" stroke-width="1.5"/>
  </pattern>
</defs>

<g clip-path="url(#clip0_4_2)">
  <!-- Background solid + grid -->
  <rect width="960" height="960" fill="#212a1a"/>
  <rect width="960" height="960" fill="url(#gridPattern)" opacity="0.55"/>

  <!-- ===== Doodle Editor di Background (belakang ikan) ===== -->
  <g fill="none" stroke="#3c522b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">

    <!-- Clapperboard - pojok kiri atas -->
    <g transform="translate(78,78) rotate(-6)">
      <rect x="0" y="0" width="94" height="20" rx="6"/>
      <polygon points="6,0 20,0 12,20 -2,20" fill="#3c522b" stroke="none"/>
      <polygon points="30,0 44,0 36,20 22,20" fill="#3c522b" stroke="none"/>
      <polygon points="54,0 68,0 60,20 46,20" fill="#3c522b" stroke="none"/>
      <polygon points="78,0 92,0 84,20 70,20" fill="#3c522b" stroke="none"/>
      <rect x="4" y="20" width="86" height="54" rx="10"/>
    </g>

    <!-- Play button - pojok kanan atas -->
    <g transform="translate(830,70)">
      <circle cx="0" cy="0" r="28"/>
      <polygon points="-8,-13 19,0 -8,13" fill="#3c522b" stroke="none"/>
    </g>

    <!-- Timeline dengan clip - atas kanan, di bawah play button -->
    <g transform="translate(600, 150)">
      <rect x="0" y="0" width="150" height="26" rx="6"/>
      <rect x="6" y="5" width="40" height="16" rx="3" fill="#3c522b" stroke="none"/>
      <rect x="52" y="5" width="55" height="16" rx="3" fill="#3c522b" stroke="none"/>
      <rect x="113" y="5" width="30" height="16" rx="3" fill="#3c522b" stroke="none"/>
      <line x1="70" y1="-8" x2="70" y2="34" stroke-width="4"/>
    </g>

    <!-- Icon badge "Ft" ala software editor - kiri tengah bawah area -->
    <g transform="translate(60, 555)">
      <rect x="0" y="0" width="92" height="92" rx="20"/>
      <text x="46" y="63" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="44" fill="#3c522b" stroke="none" text-anchor="middle">Ft</text>
    </g>

    <!-- Filmstrip - pojok kiri bawah -->
    <g transform="translate(85,800) rotate(4)">
      <rect x="0" y="0" width="130" height="44" rx="6"/>
      <rect x="9" y="7" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="29" y="7" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="49" y="7" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="69" y="7" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="89" y="7" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="9" y="27" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="29" y="27" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="49" y="27" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="69" y="27" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
      <rect x="89" y="27" width="12" height="10" rx="2" fill="#3c522b" stroke="none"/>
    </g>

    <!-- Waveform / audio track - pojok kanan bawah -->
    <g transform="translate(790,815)">
      <path d="M0 20 L0 20 M12 5 L12 35 M24 -12 L24 52 M36 -22 L36 62 M48 -8 L48 48 M60 10 L60 30 M72 -18 L72 58 M84 0 L84 40" stroke-width="7"/>
    </g>

    <!-- Line graph kecil - kanan tengah bawah -->
    <g transform="translate(805, 555)">
      <line x1="0" y1="0" x2="0" y2="95"/>
      <line x1="0" y1="95" x2="100" y2="95"/>
      <polyline points="12,75 32,50 52,60 72,22 92,38" fill="none"/>
      <circle cx="12" cy="75" r="5" fill="#3c522b" stroke="none"/>
      <circle cx="32" cy="50" r="5" fill="#3c522b" stroke="none"/>
      <circle cx="52" cy="60" r="5" fill="#3c522b" stroke="none"/>
      <circle cx="72" cy="22" r="5" fill="#3c522b" stroke="none"/>
      <circle cx="92" cy="38" r="5" fill="#3c522b" stroke="none"/>
    </g>
  </g>

  <!-- ===== OpenFishTools 2-Keyframe Fish + Leaf ===== -->
  <g transform="translate(96 96) scale(1.5)">
    <path d="M266 138C266 94 298 66 342 66C342 110 310 138 266 138Z" fill="#9cb477"/>
    <g transform="translate(0 16)">
      <path d="M96 170C89 156 99 140 115 140H194C210 140 220 156 213 170L178 238C172 249 172 263 178 274L213 342C220 356 210 372 194 372H115C99 372 89 356 96 342L131 274C137 263 137 249 131 238L96 170Z" fill="#9cb477" stroke="#212a1a" stroke-width="16" stroke-linejoin="round"/>
      <g transform="translate(52 0) rotate(45 256 256)">
        <rect x="148" y="148" width="216" height="216" rx="52" fill="#c7dc9c" stroke="#212a1a" stroke-width="16"/>
      </g>
    </g>
  </g>
</g>
</svg>
